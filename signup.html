<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Special+Elite&family=Libre+Baskerville:wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh;">

  <div style="width:380px; border:2px solid var(--ink); background:var(--paper2); padding:40px;">

    <div style="border-bottom:2px solid var(--ink); margin-bottom:24px; padding-bottom:10px;">
      <span style="font-family:'Special Elite',cursive; font-size:10px; color:var(--tobacco); text-transform:uppercase; letter-spacing:0.18em; display:block; margin-bottom:4px;">New Account</span>
      <div style="font-family:'Playfair Display',serif; font-weight:700; font-style:italic; font-size:22px; color:var(--ink);">Register</div>
    </div>

    <form id="signUpForm" style="display:flex; flex-direction:column; gap:16px;">

      <div style="display:flex; flex-direction:column; gap:5px;">
        <label style="font-family:'Special Elite',cursive; font-size:9px; text-transform:uppercase; letter-spacing:0.18em; color:var(--tobacco);">Username</label>
        <input type="text" id="name" placeholder="Your name" style="background:var(--paper); border:1px solid var(--border); padding:9px 12px; font-family:'Libre Baskerville',serif; font-size:13px; color:var(--ink); outline:none; width:100%;"/>
      </div>

      <div style="display:flex; flex-direction:column; gap:5px;">
        <label style="font-family:'Special Elite',cursive; font-size:9px; text-transform:uppercase; letter-spacing:0.18em; color:var(--tobacco);">Email</label>
        <input type="email" id="email" placeholder="your@email.com" style="background:var(--paper); border:1px solid var(--border); padding:9px 12px; font-family:'Libre Baskerville',serif; font-size:13px; color:var(--ink); outline:none; width:100%;"/>
      </div>

      <div style="display:flex; flex-direction:column; gap:5px;">
        <label style="font-family:'Special Elite',cursive; font-size:9px; text-transform:uppercase; letter-spacing:0.18em; color:var(--tobacco);">Password</label>
        <input type="password" id="password" placeholder="••••••••" style="background:var(--paper); border:1px solid var(--border); padding:9px 12px; font-family:'Libre Baskerville',serif; font-size:13px; color:var(--ink); outline:none; width:100%;"/>
      </div>

      <button type="submit" class="retro-btn retro-btn-fill" style="width:100%; margin-top:8px; padding:10px;">Register</button>

      <p style="font-family:'Special Elite',cursive; font-size:9px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-light); text-align:center;">
        Have an account? <a href="signin.html" style="color:var(--tobacco); text-decoration:underline;">Sign in here</a>
      </p>

    </form>
  </div>

  <script src="js/signup.js"></script>
</body>
</html>
