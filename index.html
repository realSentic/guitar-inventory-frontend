<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Table</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Special+Elite&family=Libre+Baskerville:wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  
</head>
<body>
  <div class="p-5">
    <button id="signout">Signout.</button>
  </div>
  <div class="ledger-header">
    <div class="ledger-title">
      <span>Current Stock</span>
      Instrument Inventory
    </div>
    <div class="ledger-controls">
      <button class="retro-btn retro-btn-outline">Filter</button>
      <button class="retro-btn retro-btn-outline">Export</button>
      <button class="retro-btn retro-btn-fill"><a href="create.html">+ Add Item</a></button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Model</th>
          <th>Color</th>
          <th>Price</th>
          <th>Availability</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
      
    </table>
</body>
</html>
