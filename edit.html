<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Instrument</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/edit.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Special+Elite&family=Libre+Baskerville:wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Libre Baskerville', Georgia, serif; }
    .font-special { font-family: 'Special Elite', cursive; }
    .font-playfair { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="min-h-screen" style="background-color: #F2E8D5; background-image: linear-gradient(rgba(139,94,32,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(139,94,32,0.04) 1px, transparent 1px); background-size: 32px 32px;">

  <div class="max-w-xl mx-auto py-16 px-6">

    <div class="text-center border-t-2 border-b-2 border-double border-amber-800 py-5 mb-10">
      <p class="font-special text-xs tracking-widest text-amber-700 uppercase mb-1">Inventory Management</p>
      <h1 class="font-playfair text-3xl font-bold text-stone-800">Edit <em class="text-amber-700">Instrument</em></h1>
    </div>

    <a href="index.html" class="font-special text-xs tracking-widest uppercase text-amber-700 hover:text-stone-800 transition-colors mb-8 inline-block">← Back to Inventory</a>

    <div class="bg-amber-100 border border-amber-700 p-8 relative">
      <div class="absolute inset-2 border border-amber-700 border-opacity-30 pointer-events-none"></div>

      <div class="mb-6 flex items-center gap-2">
        <span class="font-special text-xs tracking-widest uppercase text-amber-700">SKU:</span>
        <span id="skuDisplay" class="font-special text-xs text-stone-500">#—</span>
      </div>

      <div class="space-y-6">

        <div>
          <label class="font-special text-xs tracking-widest uppercase text-amber-700 block mb-2">Name</label>
          <input
            id="name"
            type="text"
            placeholder="e.g. Gibson Les Paul"
            class="w-full bg-amber-50 border border-amber-700 border-b-2 border-b-stone-800 px-3 py-2 font-special text-sm text-stone-800 placeholder-stone-400 outline-none focus:bg-white transition-colors"
          />
        </div>

        <div>
          <label class="font-special text-xs tracking-widest uppercase text-amber-700 block mb-2">Model</label>
          <input
            id="model"
            type="text"
            placeholder="e.g. Standard"
            class="w-full bg-amber-50 border border-amber-700 border-b-2 border-b-stone-800 px-3 py-2 font-special text-sm text-stone-800 placeholder-stone-400 outline-none focus:bg-white transition-colors"
          />
        </div>

        <div>
          <label class="font-special text-xs tracking-widest uppercase text-amber-700 block mb-2">Color</label>
          <input
            id="color"
            type="text"
            placeholder="e.g. Heritage Cherry Sunburst"
            class="w-full bg-amber-50 border border-amber-700 border-b-2 border-b-stone-800 px-3 py-2 font-special text-sm text-stone-800 placeholder-stone-400 outline-none focus:bg-white transition-colors"
          />
        </div>

        <div>
          <label class="font-special text-xs tracking-widest uppercase text-amber-700 block mb-2">Price</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 font-playfair font-bold text-stone-500 text-sm">₱</span>
            <input
              id="price"
              type="number"
              placeholder="0.00"
              class="w-full bg-amber-50 border border-amber-700 border-b-2 border-b-stone-800 pl-7 pr-3 py-2 font-special text-sm text-stone-800 placeholder-stone-400 outline-none focus:bg-white transition-colors"
            />
          </div>
        </div>

        <div class="flex items-center justify-between border border-amber-700 border-opacity-40 px-4 py-3 bg-amber-50">
          <div>
            <p class="font-special text-xs tracking-widest uppercase text-amber-700">In Stock</p>
            <p class="font-special text-xs text-stone-400 mt-0.5">Is this item currently available?</p>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input id="in_stock" type="checkbox" class="sr-only peer"/>
            <div class="w-11 h-6 bg-stone-300 peer-checked:bg-amber-700 transition-colors duration-200 relative">
              <div class="absolute top-1 left-1 w-4 h-4 bg-white transition-transform duration-200 peer-checked:translate-x-5"></div>
            </div>
          </label>
        </div>

        <div class="flex gap-3 pt-2">
          <button
            id="saveBtn"
            class="flex-1 bg-stone-800 hover:bg-amber-700 text-amber-50 font-special text-xs tracking-widest uppercase py-3 transition-colors duration-200"
          >
            ✎ Save Changes
          </button>
          <a
            href="index.html"
            class="px-6 bg-transparent border border-stone-800 hover:bg-stone-100 text-stone-800 font-special text-xs tracking-widest uppercase py-3 transition-colors duration-200 flex items-center"
          >
            Cancel
          </a>
        </div>

      </div>
    </div>

  </div>


</body>
</html>
